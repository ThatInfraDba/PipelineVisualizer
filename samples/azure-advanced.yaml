trigger:
  - main

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: staging
    values: [staging, production]
  - name: runIntegration
    type: boolean
    default: true

variables:
  - group: shared-secrets
  - name: buildConfiguration
    value: Release

resources:
  repositories:
    - repository: templates
      type: github
      name: example/pipeline-templates
      ref: refs/tags/v3
  pipelines:
    - pipeline: upstream
      source: example-upstream-ci
      trigger: true
  containers:
    - container: sdk
      image: mcr.microsoft.com/dotnet/sdk:9.0

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Test
        strategy:
          matrix:
            linux:
              imageName: ubuntu-latest
            windows:
              imageName: windows-latest
          maxParallel: 2
        container: sdk
        services:
          redis: redis
        timeoutInMinutes: 30
        steps:
          - checkout: self
          - template: steps/restore.yml@templates
            parameters:
              configuration: $(buildConfiguration)
          - script: dotnet test
            displayName: Run tests
            condition: succeeded()
      - template: jobs/security-scan.yml@templates

  - template: stages/integration.yml@templates
    parameters:
      enabled: ${{ parameters.runIntegration }}

  - stage: Staging
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: sequential
    jobs:
      - deployment: DeployStaging
        displayName: Deploy to staging
        environment: staging
        strategy:
          runOnce:
            preDeploy:
              steps:
                - script: echo Pre-deploy checks
            deploy:
              steps:
                - script: ./deploy.sh staging
                  displayName: Deploy
            on:
              failure:
                steps:
                  - script: ./rollback.sh staging
                    displayName: Roll back

  - stage: Production
    dependsOn: Staging
    trigger: manual
    isSkippable: false
    jobs:
      - deployment: DeployProduction
        environment: production
        strategy:
          canary:
            increments: [10, 50]
            deploy:
              steps:
                - script: ./deploy.sh production
                  displayName: Canary deploy
            postRouteTraffic:
              steps:
                - script: ./smoke.sh
                  displayName: Smoke test
