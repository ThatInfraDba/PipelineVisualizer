include:
  - local: ci/templates/lint.yml
  - project: platform/ci-templates
    ref: v3.2.0
    file:
      - /templates/security.yml
  - component: $CI_SERVER_FQDN/components/sast/sast@2.1.0
  - template: Jobs/Code-Quality.gitlab-ci.yml

workflow:
  name: Release pipeline
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  auto_cancel:
    on_new_commit: interruptible

stages:
  - build
  - test
  - deploy

.setup:
  before_script:
    - echo "Shared setup"
  script:
    - npm ci

.node-job:
  image: node:22
  stage: build
  tags: [docker]
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/]
    policy: pull-push
  retry:
    max: 2
    when: [runner_system_failure]

build:
  extends: .node-job
  script:
    - !reference [.setup, script]
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

test:
  extends: .node-job
  stage: test
  needs: [build]
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
        SUITE: [unit, integration]
  services:
    - name: postgres:16
      alias: db
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  timeout: 30 minutes
  script:
    - npm test
  artifacts:
    reports:
      junit: junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
    - when: never

docs:
  stage: build
  trigger:
    include: docs/.gitlab-ci.yml
    strategy: depend

deploy-infra:
  stage: deploy
  trigger:
    project: platform/infrastructure
    branch: main
    forward:
      pipeline_variables: true

deploy:
  stage: deploy
  needs: [test]
  resource_group: production
  environment:
    name: production
    action: start
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://sts.amazonaws.com
  secrets:
    DATABASE_PASSWORD:
      vault: production/db/password@ops
  inputs:
    version:
      default: latest
  when: manual
  script:
    - ./deploy.sh

release:
  stage: .post
  release:
    tag_name: $CI_COMMIT_TAG
    description: Release $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing"
